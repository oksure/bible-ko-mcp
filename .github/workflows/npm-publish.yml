name: Publish to NPM

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: do NOT set registry-url here — it makes setup-node write a
      # token-expecting .npmrc (`//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # + always-auth), which breaks pure-OIDC trusted publishing on modern npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm OIDC trusted publishing requires npm >= 11.5.1; the version bundled
      # with Node 22 is older, so upgrade before publishing.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --provenance --access public
